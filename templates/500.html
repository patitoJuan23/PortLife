{% extends 'base.html' %}

{% block title %}Error de Servidor | PortLife{% endblock %}

{% block content %}
<section class="section-padding text-center" style="min-height: 75vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="tech-card py-5">
                    <h1 class="display-1 fw-bold text-danger mb-2">500</h1>
                    <h2 class="h4 text-light mb-3">Error Interno del Servidor</h2>
                    <p class="text-secondary mb-4">
                        Ocurrió una anomalía inesperada al procesar la solicitud. Nuestro equipo ya ha registrado el evento.
                    </p>
                    <a href="{{ url_for('public.index') }}" class="btn-electric">
                        <i class="bi bi-arrow-left"></i> Volver al Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
